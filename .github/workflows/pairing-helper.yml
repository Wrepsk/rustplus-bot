name: Pairing Helper
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  windows-helper:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - run: npm run check
      - run: npm run package:pairing
      - uses: actions/upload-artifact@v4
        with:
          name: RustPlus-Pairing-Windows-x64
          path: |
            artifacts/RustPlus-Pairing-Windows-x64.zip
            artifacts/RustPlus-Pairing-Windows-x64.zip.sha256
          if-no-files-found: error
