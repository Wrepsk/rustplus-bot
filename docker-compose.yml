services:
  rust-bot:
    build: .
    # Run Node directly; some VPS hosts deny execution of Docker's injected init helper.
    # The bot handles SIGTERM/SIGINT itself and does not spawn child processes.
    init: false
    restart: unless-stopped
    env_file: .env
    environment:
      DATABASE_PATH: /app/data/bot.sqlite
    volumes:
      - bot-data:/app/data
    stop_grace_period: 20s
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    logging:
      driver: json-file
      options:
        max-size: 10m
        max-file: '3'
volumes:
  bot-data:
